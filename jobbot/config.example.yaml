# Copy to config.yaml and adjust. Secrets (API keys, passwords) go in .env — not here.

search:
  # One search is run per keyword per location. Empty list = all part-time jobs.
  keywords:
    - "barista"
    - "retail assistant"
    - "warehouse"
  locations:
    - "London"
    # - "Manchester"      # add more cities, or use "England" on Adzuna for country-wide
  distance_miles: 15
  part_time_only: true
  include_title: []        # e.g. ["assistant", "crew"] — keep only titles containing one of these
  exclude_title:           # drop jobs whose title contains any of these
    - "senior"
    - "manager"
  max_age_minutes: 0       # 0 = off. e.g. 30 = ignore anything posted more than 30 min ago

sources:
  reed:
    enabled: true
    poll_seconds: 30       # how often to re-query. Keep >= 20s to stay polite to the API.
  adzuna:
    enabled: true
    poll_seconds: 30
  amazon_uk:               # jobsatamazon.co.uk — Amazon warehouse/sortation roles.
    enabled: true          # No API key needed; uses a headless browser session.
    poll_seconds: 15       # These roles fill within minutes, so poll faster.
                           # NOTE: country-wide (all UK); keywords/locations don't apply,
                           # only include_title/exclude_title filters do.

# Company career portals watched DIRECTLY (no aggregator delay, no API key).
# Each entry: the search-results URL to watch + a regex matching job-detail links.
# Add any employer the same way — open their careers search page, look at a job
# link's URL, and put its distinctive part in link_pattern.
portals:
  - name: mcdonalds
    company: "McDonald's"
    url: "https://people.mcdonalds.co.uk/job-search/?location=London"
    link_pattern: "/job-search/restaurant-"
    poll_seconds: 60
  - name: primark
    company: "Primark"
    url: "https://careers.primark.com/en/location/england-jobs/8171/2635167-6269131/3"
    link_pattern: "/en/job/"
    poll_seconds: 60
  - name: sainsburys
    company: "Sainsbury's"
    url: "https://sainsburys.jobs/jobs/?location=London"
    link_pattern: "/jobs/description/"
    poll_seconds: 60
  - name: tesco
    company: "Tesco"
    url: "https://careers.tesco.com/en_GB/careers/SearchJobs/London"  # keyword after SearchJobs/
    link_pattern: "/JobDetail/"
    poll_seconds: 60
  - name: costa
    company: "Costa Coffee"
    url: "https://costacareers.co.uk/job-search/"
    link_pattern: "/vacancy/"
    poll_seconds: 90
    timeout_seconds: 60    # slow site; may not load from cloud/datacenter IPs,
                           # works from a normal home connection

# Real-time watching of Telegram groups/channels that post job links (e.g.
# Amazon warehouse alert groups). Push-based: the bot reacts 1-2 s after the
# message lands — faster than any polling. Needs TELEGRAM_API_ID/HASH in .env
# and a one-time `python -m jobbot telegram-login`.
telegram_watch:
  enabled: false
  chats: []                # e.g. ["@amazonwarehousejobsuk", -1001234567890]
                           # empty list = watch ALL chats you're a member of.
                           # `telegram-login` prints your chats + their ids.

apply:
  enabled: false           # true = auto-apply on Reed. false = notify-only (recommended to start)
  max_per_hour: 12         # safety cap on automatic applications
  headless: true           # set false to watch the browser apply
  cover_letter_template: "cover_letter.txt"   # optional; {title} {company} {location} placeholders
  storage_state: "data/reed_login.json"
  amazon_enabled: false    # EXPERIMENTAL auto-apply on jobsatamazon.co.uk.
                           # Requires one-time `python -m jobbot amazon-login`.
                           # Start with headless: false to watch it work.
  amazon_profile: "data/amazon_profile"

db_path: "data/jobbot.db"
