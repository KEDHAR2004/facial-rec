<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>facial-rec</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1e293b, #0b1120);
      color: #e2e8f0;
      min-height: 100vh;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
    header { text-align: center; margin-bottom: 32px; }
    h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: -0.02em; }
    .subtitle { color: #94a3b8; margin: 0; }
    .card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    input[type="file"] {
      flex: 1 1 240px;
      padding: 12px;
      border: 1px dashed rgba(148, 163, 184, 0.4);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.6);
      color: #cbd5e1;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      transition: transform 0.05s ease, filter 0.15s ease;
    }
    button:active { transform: translateY(1px); }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #22d3ee); color: #0b1120; }
    .btn-secondary { background: rgba(148, 163, 184, 0.16); color: #e2e8f0; }
    button:hover { filter: brightness(1.08); }
    .divider { text-align: center; color: #64748b; margin: 18px 0; font-size: 13px; }
    .result { margin-top: 28px; }
    .badge {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      background: rgba(34, 211, 238, 0.15); color: #67e8f9;
      font-weight: 600; margin-bottom: 16px;
    }
    .result img {
      width: 100%; border-radius: 12px; border: 1px solid rgba(148,163,184,0.25);
      display: block;
    }
    .error { color: #fca5a5; margin-top: 16px; }
    footer { text-align: center; color: #475569; margin-top: 40px; font-size: 13px; }
    code { background: rgba(148,163,184,0.15); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>facial-rec</h1>
      <p class="subtitle">Offline face detection powered by OpenCV Haar cascades</p>
    </header>

    <div class="card">
      <form method="post" enctype="multipart/form-data">
        <div class="controls">
          <input type="file" name="image" accept="image/*" />
          <button type="submit" class="btn-primary">Detect faces</button>
        </div>
      </form>
      <div class="divider">— or —</div>
      <form method="post">
        <input type="hidden" name="use_sample" value="1" />
        <button type="submit" class="btn-secondary">Try the bundled sample image</button>
      </form>

      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      {% if result %}
        <div class="result">
          <span class="badge">{{ result.count }} face(s) detected</span>
          <img src="data:image/png;base64,{{ result.image_b64 }}" alt="annotated result" />
        </div>
      {% endif %}
    </div>

    <footer>
      CLI: <code>python -m facial_rec detect &lt;image&gt; -o out.jpg</code>
    </footer>
  </div>
</body>
</html>
